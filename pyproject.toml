[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dawn-cli"
version = "1.8.1"
description = "A beautiful weather, time and date dashboard for your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["terminal", "weather", "clock", "cli", "tui", "arch-linux", "macos"]
dependencies = []

[project.urls]
Homepage = "https://github.com/miron302/dawn-cli"

[project.scripts]
dawn = "dawn.app:main"

[tool.setuptools]
packages = ["dawn"]

[tool.setuptools.package-data]
dawn = ["helper/*"]
